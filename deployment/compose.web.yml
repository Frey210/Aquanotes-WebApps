services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a verified release image}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "192.168.10.64:8080:80"
    networks:
      - default

networks:
  default:
    external: true
    name: stage2_default
